name: Pipeline INMET

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingestao Bronze
        run: python src/ingest/baixar_historico.py $(date +%Y)

      - name: Transformacao Silver
        run: python src/transform/bronze_to_silver.py $(date +%Y)

      - name: Modelagem Gold
        run: python src/transform/silver_to_gold.py $(date +%Y)

      - name: Testes de qualidade (dbt)
        working-directory: dbt_project
        run: |
          mkdir -p ci_profiles
          cat > ci_profiles/profiles.yml << 'PROFILE'
          clima_lakehouse:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "clima.duckdb"
          PROFILE
          export DBT_PROFILES_DIR=$(pwd)/ci_profiles
          dbt deps
          dbt build
